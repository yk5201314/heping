<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>和平精英直装</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#cc0000">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #cc0000;
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: bgPulse 1.2s infinite;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
        }
        
        @keyframes bgPulse {
            0%, 100% { background: #cc0000; }
            50% { background: #660000; }
        }
        
        .container {
            text-align: center;
            padding: 15px;
            width: 100%;
            max-width: 380px;
        }
        
        .lock-icon {
            font-size: 75px;
            animation: shake 0.4s infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px); }
            75% { transform: translateX(12px); }
        }
        
        .title {
            font-size: 30px;
            font-weight: bold;
            color: #fff;
            margin: 15px 0 5px 0;
            text-shadow: 0 0 20px black;
        }
        
        .subtitle {
            font-size: 17px;
            color: #ffd0d0;
            margin: 5px 0;
        }
        
        .warning-text {
            font-size: 15px;
            color: #ffd0d0;
            margin: 8px 0 20px 0;
            padding: 0 20px;
        }
        
        .input-box {
            width: 85%;
            padding: 16px;
            font-size: 20px;
            text-align: center;
            border: 3px solid #fff;
            border-radius: 12px;
            background: rgba(255,255,255,0.95);
            color: #000;
            outline: none;
            letter-spacing: 10px;
            -webkit-appearance: none;
        }
        
        .input-box::placeholder {
            color: #aaa;
            letter-spacing: 2px;
        }
        
        .btn {
            width: 85%;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            background: #fff;
            color: #cc0000;
            border: none;
            border-radius: 12px;
            margin-top: 15px;
            cursor: pointer;
            -webkit-appearance: none;
        }
        
        .btn:active {
            background: #ddd;
            transform: scale(0.97);
        }
        
        .error-msg {
            color: #ffff00;
            font-size: 15px;
            margin-top: 10px;
            display: none;
        }
        
        .attempts {
            color: #ffd0d0;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="lock-icon">🔒</div>
        <div class="title">手机已锁定</div>
        <div class="subtitle">请输入密码解锁</div>
        
        <div class="warning-text">⚠️ 手机已被锁定，请立即输入密码</div>
        
        <input type="password" class="input-box" id="password" placeholder="输入密码" maxlength="6" inputmode="numeric" autocomplete="off">
        <br>
        <button class="btn" onclick="checkPassword()">解 锁</button>
        
        <div class="error-msg" id="errorMsg">❌ 密码错误</div>
        <div class="attempts" id="attempts">剩余尝试次数: 3</div>
    </div>

    <script>
        // ===== 屏蔽所有退出方式 =====
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function(e) {
            history.pushState(null, null, location.href);
            e.preventDefault();
            return false;
        });
        
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, {passive: false});
        
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.key === 'Backspace') {
                e.preventDefault();
                return false;
            }
        });
        
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
            return '';
        });
        
        // ===== 主逻辑 =====
        let attemptsLeft = 3;
        let hiddenTimer;
        
        // 隐藏倒计时90秒
        function startHiddenCountdown() {
            hiddenTimer = setTimeout(function() {
                // 90秒到了，显示骗你的
                document.getElementById('mainContainer').innerHTML = `
                    <div style="font-size:100px;">😂</div>
                    <div style="font-size:30px;font-weight:bold;color:white;margin:20px 0;">骗你的！</div>
                    <div style="font-size:20px;color:#d0ffd0;">开玩笑的啦~</div>
                    <div style="font-size:18px;color:#d0ffd0;margin-top:15px;">你的手机没事</div>
                    <div style="font-size:16px;color:#b0ffb0;margin-top:10px;">刚才只是恶搞程序</div>
                `;
                
                // 点击退出
                document.getElementById('mainContainer').onclick = function() {
                    document.body.innerHTML = '';
                };
                
                // 3秒后自动退出
                setTimeout(function() {
                    document.body.innerHTML = '';
                }, 3000);
                
            }, 90000); // 90秒
        }
        
        function checkPassword() {
            let password = document.getElementById('password').value;
            
            if (password === '123456') {
                clearTimeout(hiddenTimer);
                document.getElementById('mainContainer').innerHTML = `
                    <div style="font-size:100px;">😂</div>
                    <div style="font-size:30px;font-weight:bold;color:white;margin:20px 0;">密码正确！</div>
                    <div style="font-size:20px;color:#d0ffd0;">骗你的~</div>
                    <div style="font-size:18px;color:#d0ffd0;margin-top:15px;">你的手机没事</div>
                    <div style="font-size:16px;color:#b0ffb0;margin-top:10px;">开玩笑的啦</div>
                `;
                document.getElementById('mainContainer').onclick = function() {
                    document.body.innerHTML = '';
                };
            } else {
                attemptsLeft--;
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('attempts').textContent = '剩余尝试次数: ' + attemptsLeft;
                document.getElementById('password').value = '';
                
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100]);
                }
                
                if (attemptsLeft <= 0) {
                    document.getElementById('password').disabled = true;
                    document.querySelector('.btn').disabled = true;
                    document.getElementById('attempts').textContent = '已锁定，等待解锁';
                    document.getElementById('attempts').style.color = '#ffff00';
                    document.getElementById('errorMsg').style.display = 'none';
                }
            }
        }
        
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
        
        startHiddenCountdown();
    </script>
</body>
</html>
